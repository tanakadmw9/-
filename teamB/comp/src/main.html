  #hdr { left: 132px; top: 46px; font-size: 38px; font-weight: 400; color: var(--mist); letter-spacing: .04em; }

  #title .t { font-family: "MIN", serif; font-weight: 800; font-size: 136px; letter-spacing: .08em; line-height: 1; }
  #title .s { margin-top: 26px; font-size: 52px; font-weight: 700; letter-spacing: .04em; opacity: 0; }
  #panel { position: absolute; left: 968px; top: var(--img-top); width: 952px; height: var(--img-h); z-index: 14; transform: translateX(956px); }

  #end { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 40; background: var(--bar); opacity: 0; text-align: center; color: var(--text); }
  #end .t { position: absolute; left: 0; width: 1920px; top: 392px; font-family: "MIN", serif; font-weight: 800; font-size: 120px; letter-spacing: .1em; line-height: 1; opacity: 0; }

  #black { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #000; z-index: 50; opacity: 0; }
</style>

        <text x="190" y="664" fill="#fff" font-size="44" font-weight="700">基準点</text>

        <path d="M0 120 H1920 M0 300 H1920 M0 540 H1920"/>

        <g transform="translate(1050 690) rotate(6)"><path d="M-62 120 L-64 20 C-64 -40 -40 -78 0 -80 C40 -78 64 -40 64 20 L62 120"/><path d="M-30 -10 h60 M-34 18 h68 M-36 46 h72" stroke-width="4"/><path d="M-46 -40 C-30 -58 30 -58 46 -40" stroke-width="3" stroke-opacity=".7"/></g>
      </g>
    </svg>
  </div>
  <!-- 点が金属標の外形に変わる輪（S06 の手前の点 → 金属標）。画の座標 -->

    <ellipse id="morph" cx="1565" cy="600" rx="40" ry="12" fill="none" stroke="#fff" stroke-width="7" opacity="0"/>

  <div class="bar top"></div><div class="bar bot"></div>

<script>
  window.TL = {{TL}};
  (function () {
    const C = TL.cues, S = {}; TL.shots.forEach(s => S[s.id] = s);
    const tl = gsap.timeline({ paused: true });
    const IN = { duration: 0.5, ease: "power3.out" }, OUT = { duration: 0.3, ease: "power2.in" };
    const show = (el, t, y = 16) => tl.fromTo(el, { opacity: 0, y }, { opacity: 1, y: 0, ...IN, immediateRender: false }, t);
    const hide = (el, t) => tl.to(el, { opacity: 0, ...OUT }, t);
    const len = id => document.getElementById(id).getTotalLength();
    // 線を描き進める（実線は dashoffset、破線はマスクの実線を描き進める）
    const draw = (sel, t, d = 0.5) => document.querySelectorAll(sel).forEach(p => {
      const L = p.getTotalLength(); gsap.set(p, { strokeDasharray: L, strokeDashoffset: L });
      tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
    });
    // ---- コールドオープン：S02 の指の先に「？」 ----
    draw("#mq", C.q, 0.6); tl.set("#ar_q", { opacity: 1 }, C.q);
    tl.fromTo("#q_mark", { opacity: 0, scale: 0.6, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, C.q + 0.6);
    hide("#ar_q", S.c04.start + S.c04.dur - 0.35);
    // ---- タイトル（答え） ----
    show("#hdr", TL.texts.find(t => t.id === "hdr").start, 0); hide("#hdr", TL.texts.find(t => t.id === "hdr").end - 0.3);
    tl.fromTo("#title", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, C.title);
    show("#title .s", C.title + 0.4); hide("#title", S.c06.start - 0.35);
    // S04 の止め：毎秒 1% の寄り（止めたことを感じさせない）
    const f5 = S.c05.start + S.c05.dur - S.c05.freeze_tail;
    tl.fromTo("#v_c05", { scale: 1 }, { scale: 1 + 0.01 * S.c05.freeze_tail, transformOrigin: "62% 40%", duration: S.c05.freeze_tail, ease: "none", immediateRender: false }, f5);
    // ---- S01：わかっている点／まだの点 ----
    show("#s01_known", C.s01_known, 0); show("#s01_new", C.s01_new, 0);
    show("#c_kijun", C.s01_label, 0); show("#s01_lead", C.s01_label, 0);
    ["#s01_known", "#s01_new", "#c_kijun", "#s01_lead"].forEach(e => hide(e, S.c07.start - 0.3));
    show("#t_def", TL.texts.find(t => t.id === "def").start, 0); hide("#t_def", TL.texts.find(t => t.id === "def").end - 0.3);
    // ---- 分割画面：左の画が寄り、右に観測パネル ----
    tl.to("#v_c09", { x: S.c09.slide, duration: 0.6, ease: "power2.inOut" }, C.split);
    tl.to("#panel", { x: 0, duration: 0.6, ease: "power2.inOut" }, C.split);
    show("#p_head", C.split + 0.5, 0); show("#p_A", C.split + 0.55, 0);
    draw("#mab", C.split + 0.8, 0.6); tl.to("#p_B", { opacity: 1, duration: 0.4 }, C.split + 0.8);
    gsap.set("#p_arc", { opacity: 0 }); tl.set("#p_arc", { opacity: 1 }, C.split_arc); draw("#p_arc", C.split_arc, 0.6); show("#p_arc_t", C.split_arc + 0.3, 0);
    show("#p_Pq", C.split_dist - 0.4, 0);
    gsap.set("#p_dist", { opacity: 0 }); tl.set("#p_dist", { opacity: 1 }, C.split_dist); draw("#p_dist", C.split_dist, 0.5); show("#p_dist_t", C.split_dist + 0.3, 0);
    // 光の往復（はかる）：1往復 1.0秒 ×2（点滅にならない速さ）
    tl.set("#p_light", { opacity: 1, attr: { cx: 250, cy: 590 } }, C.split_dist + 0.5);
    for (let i = 0; i < 2; i++) {
      tl.to("#p_light", { attr: { cx: 620, cy: 340 }, duration: 0.5, ease: "sine.inOut" }, C.split_dist + 0.5 + i);
      tl.to("#p_light", { attr: { cx: 250, cy: 590 }, duration: 0.5, ease: "sine.inOut" }, C.split_dist + 1.0 + i);
    }
    tl.to("#p_light", { opacity: 0, duration: 0.2 }, C.split_dist + 2.5);
    tl.to("#p_Pq", { opacity: 0, duration: 0.2 }, C.split_p - 0.1);
    tl.fromTo("#p_P", { opacity: 0, scale: 1.8, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, C.split_p);
    show("#p_tag", C.split_p + 0.15, 0); show("#p_P_t", C.split_p + 0.3, 0);
    tl.set("#panel", { opacity: 0 }, C.s10);   // 分割画面は閉じずに直に切る（editing.md §5）
    // ---- S10：点をつないで輪を閉じる（確かめる） ----
    show("#t_q2", C.s10 + 0.1, 0); hide("#t_q2", C.s10_loop - 0.3);
    gsap.set("#net_pts > g", { opacity: 0 });
    document.querySelectorAll("#net_pts > g").forEach((g, i) => tl.to(g, { opacity: 1, duration: 0.3 }, C.s10_net + 0.25 * i));
    gsap.set(["#net", "#net_e"], { opacity: 0 }); tl.set(["#net", "#net_e"], { opacity: 1 }, C.s10_net + 1.1);
    draw("#net, #net_e", C.s10_net + 1.1, 1.6);   // 点をつないで、輪を閉じる（ゆっくり）
    tl.fromTo("#net_ring", { opacity: 0.9, attr: { rx: 16, ry: 5 } }, { opacity: 0, attr: { rx: 70, ry: 22 }, duration: 0.8, ease: "power2.out", immediateRender: false }, C.s10_net + 2.7);
    hide("#ar_s10", C.s10_loop - 0.3);
    // S10 の止め
    const f12 = S.c12.start + S.c12.dur - S.c12.freeze_tail;
    // ---- S06（2回目）：点から地図と道路 ----
    const live13 = S.c13.dur - S.c13.freeze_tail, f13 = S.c13.start + live13;
    gsap.set("#ar_s06", { x: 34 }); tl.to("#ar_s06", { x: 0, duration: live13, ease: "none" }, S.c13.start);  // 元のパン（約 −11px/秒）に合わせて動かす
    show("#s06_pts", C.s06_pts, 0);
    gsap.set("#s06_links", { opacity: 0 }); tl.to("#s06_links", { opacity: 1, duration: 0.6 }, C.s06_link);   // 「つないで」
    gsap.set("#contours .draw", { opacity: 1 }); draw("#contours .draw", C.contour, 0.8); show("#c_map", C.contour + 0.3, 0);
