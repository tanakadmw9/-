  <script>
    (function () {
      const v = window.__hyperframes.getVariables();
      const c = JSON.parse(v.cues);
      const tl = gsap.timeline({ paused: true });
      const MIDSCALE = 0.75000;   // 橋の先が中央の手前で止まる位置

      // network：基準点が中心から外へ波のように広がって網になる（0.9秒）
      const ptDelay = [0.178, 0.318, 0.418, 0.293, 0.445, 0.2, 0.399, 0.347, 0.25, 0.4, 0.5, 0.207, 0.393, 0.205, 0.352];
      ptDelay.forEach((d, k) => {
        tl.fromTo("#d4-p" + k, { opacity: 0, scale: 0.4, transformOrigin: "50% 64%" },
          { opacity: 1, scale: 1, transformOrigin: "50% 64%", duration: 0.36, ease: "power3.out" }, c.network + d);
      });
      const lnDelay = [0.438, 0.32, 0.538, 0.538, 0.565, 0.565, 0.413, 0.565, 0.519, 0.467, 0.519, 0.52, 0.62, 0.37, 0.52, 0.62, 0.513, 0.327, 0.472, 0.472, 0.513];
      lnDelay.forEach((d, k) => {
        tl.fromTo("#d4-ln" + k, { opacity: 0 }, { opacity: 0.32, duration: 0.3, ease: "power1.out" }, c.network + d);
      });

      // road：網の点をたどるように、設計線が左から右へ（川を横切る）
      tl.fromTo("#d4-roadmask-path", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, c.road);

      // banks → middle：両岸から橋が同時にのび、中央の手前で止まる
      tl.fromTo("#d4-wings", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, c.banks);
      tl.fromTo("#d4-brL", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: MIDSCALE, transformOrigin: "0% 50%", duration: c.middle - c.banks, ease: "power1.inOut" }, c.banks);
      tl.fromTo("#d4-brR", { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: MIDSCALE, transformOrigin: "100% 50%", duration: c.middle - c.banks, ease: "power1.inOut" }, c.banks);

      // pause：何も動かさない（c.middle 〜 c.same_point は完全な静止）

      // same_point：網の中の基準点を1つ強調 → 両側の橋の先からオレンジの線が結ばれて光る
      const sp = c.same_point;
      tl.fromTo("#d4-p0", { scale: 1, transformOrigin: "50% 64%" }, { scale: 1.3, transformOrigin: "50% 64%", duration: 0.45, ease: "power3.out", immediateRender: false }, sp);
      tl.fromTo("#d4-ring", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, sp);
      tl.fromTo("#d4-same", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, sp + 0.1);
      tl.fromTo(["#d4-tipL", "#d4-tipR"], { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, sp + 0.22);
      tl.fromTo(["#d4-tieL", "#d4-tieR", "#d4-glowL", "#d4-glowR"], { strokeDashoffset: 100 },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, sp + 0.22);
      tl.fromTo(["#d4-glowL", "#d4-glowR"], { opacity: 0 }, { opacity: 0.34, duration: 0.3, ease: "power2.out" }, sp + 0.5);
      tl.fromTo(["#d4-glowL", "#d4-glowR"], { opacity: 0.34 }, { opacity: 0.18, duration: 0.6, ease: "power2.inOut", immediateRender: false }, c.join + 0.05);

      // join：すき間が閉じて1本に（接する瞬間 = c.join、効果音「カチッ」）
      tl.fromTo(["#d4-brL", "#d4-brR"], { scaleX: MIDSCALE }, { scaleX: 1, duration: 0.22, ease: "power2.in", immediateRender: false }, c.join - 0.22);
      tl.fromTo(["#d4-tipL", "#d4-tipR"], { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.in", immediateRender: false }, c.join - 0.12);
      tl.fromTo("#d4-seam", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, c.join);

      window.__timelines["d4_bridge"] = tl;
    })();
  </script>
