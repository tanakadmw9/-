<html data-composition-variables='[{"id":"cues","type":"string","label":"cues","default":"{\"desat\":0.0,\"ts_label\":0.2,\"prism_label\":1.57,\"angle\":3.37,\"distance\":4.09,\"to_paper\":5.5}"},{"id":"dur","type":"number","label":"dur","default":6.2062},{"id":"ts_x","type":"number","label":"TS x","default":613},{"id":"ts_y","type":"number","label":"TS y","default":572},{"id":"prism_x","type":"number","label":"プリズム x","default":1446},{"id":"prism_y","type":"number","label":"プリズム y","default":137}]'>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; }
    #d1-photo, #d1-desat { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #d1-paper { position: absolute; inset: 0; background: var(--paper); opacity: 0; }
    #d1-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    .d1-plate { position: absolute; background: var(--plate); border-radius: var(--plate-radius);
      padding: 16px 28px 18px; font-feature-settings: "palt"; white-space: nowrap; }
    .d1-main { font-family: var(--font-ja); font-weight: 700; font-size: 48px; line-height: 1.3; color: var(--white); }
    .d1-sub { font-family: var(--font-ja); font-weight: 400; font-size: 36px; line-height: 1.35; color: var(--sub); margin-top: 4px; }
    #d1-ts-plate { left: 1012px; top: 606px; }
    #d1-pr-plate { left: 1290px; top: 404px; width: 312px; text-align: center; padding-left: 0; padding-right: 0; }
  </style>
  <div id="root" data-composition-id="d1_observe" data-width="1920" data-height="1080">
    <img id="d1-photo" src="assets/video/S09_freeze.png" alt="">
    <img id="d1-desat" src="assets/video/S09_freeze_desat.png" alt="">
    <div id="d1-paper"></div>
    <svg id="d1-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <!-- 光の線（角度＝向き）：ごく弱い発光＋本線 -->
      <line id="d1-beam-glow" x1="613" y1="572" x2="1446" y2="137" stroke="var(--orange)" stroke-width="16" stroke-linecap="round" opacity="0.18"
            pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110"/>
      <line id="d1-beam" x1="613" y1="572" x2="1446" y2="137" stroke="var(--orange)" stroke-width="5" stroke-linecap="round"
            pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110"/>
      <!-- 測距の光の粒 -->
      <g id="d1-photon" opacity="0">
        <circle r="20" fill="var(--orange)" opacity="0.28"/>
        <circle r="9" fill="var(--orange)"/>
      </g>
      <circle id="d1-bounce" cx="1446" cy="137" r="14" fill="none" stroke="var(--orange)" stroke-width="4" opacity="0"/>
      <!-- 対象ラベルの点と引き出し線 -->
      <g id="d1-ts-lead">
        <line id="d1-ts-line" x1="613" y1="572" x2="1012" y2="640" stroke="var(--white)" stroke-width="2"
              pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110"/>
        <circle id="d1-ts-dot" cx="613" cy="572" r="5" fill="var(--white)" opacity="0"/>
      </g>
      <g id="d1-pr-lead">
        <line id="d1-pr-line" x1="1446" y1="137" x2="1446" y2="404" stroke="var(--white)" stroke-width="2"
              pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110"/>
        <circle id="d1-pr-dot" cx="1446" cy="137" r="5" fill="var(--white)" opacity="0"/>
      </g>
      <!-- 紙に溶けたあとの記号：TS＝紺の△、プリズム＝オレンジの◎ -->
      <g id="d1-known">
        <g id="d1-known-in" opacity="0">
          <path d="M0 -38 L32.9 19 L-32.9 19 Z" fill="var(--paper)" stroke="var(--navy)" stroke-width="5" stroke-linejoin="round"/>
          <circle r="6" fill="var(--navy)"/>
        </g>
      </g>
      <g id="d1-new">
        <g id="d1-new-in" opacity="0">
          <circle r="28" fill="var(--paper)" stroke="var(--orange)" stroke-width="5"/>
          <circle r="12" fill="none" stroke="var(--orange)" stroke-width="5"/>
        </g>
      </g>
    </svg>
    <div id="d1-ts-plate" class="d1-plate">
      <div class="d1-main">トータルステーション</div>
      <div class="d1-sub">角度と距離をはかる機械</div>
    </div>
    <div id="d1-pr-plate" class="d1-plate">
      <div class="d1-main">プリズム</div>
      <div class="d1-sub">光をはね返す鏡</div>
    </div>
  </div>
  <script>
    (function () {
      const v = window.__hyperframes.getVariables();
      const c = JSON.parse(v.cues);
      const dur = Number(v.dur) || 6.2;
      const tx = Number(v.ts_x), ty = Number(v.ts_y), px = Number(v.prism_x), py = Number(v.prism_y);
      const q = (s) => document.querySelector(s);
      const setA = (s, o) => { const el = q(s); for (const k in o) el.setAttribute(k, o[k]); };

      // 変数の位置に合わせて図形を置く
      ["#d1-beam", "#d1-beam-glow"].forEach((s) => setA(s, { x1: tx, y1: ty, x2: px, y2: py }));
      setA("#d1-ts-line", { x1: tx, y1: ty });
      setA("#d1-ts-dot", { cx: tx, cy: ty });
      setA("#d1-pr-line", { x1: px, y1: py, x2: px });
      setA("#d1-pr-dot", { cx: px, cy: py });
      setA("#d1-bounce", { cx: px, cy: py });

      const tl = gsap.timeline({ paused: true });
      const IN = { duration: 0.5, ease: "power3.out" };
      const draw = (s, at, d, ease) => tl.fromTo(s, { attr: { "stroke-dashoffset": 110 } }, { attr: { "stroke-dashoffset": 0 }, duration: d, ease: ease || "power2.inOut" }, at);

      // desat：色の写真 → 落ち着いた写真（画像のクロスフェード）
      tl.fromTo("#d1-desat", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, c.desat);

      // ts_label：点 → 引き出し線 → 板
      tl.fromTo("#d1-ts-dot", { opacity: 0, attr: { r: 2 } }, { opacity: 1, attr: { r: 5 }, duration: 0.25, ease: "power3.out" }, c.ts_label);
      draw("#d1-ts-line", c.ts_label + 0.12, 0.35, "power2.out");
      tl.fromTo("#d1-ts-plate", { opacity: 0, y: 20 }, { opacity: 1, y: 0, ...IN }, c.ts_label + 0.32);

      // prism_label：点 → 下へ引き出し線（2人の間）→ 板
      tl.fromTo("#d1-pr-dot", { opacity: 0, attr: { r: 2 } }, { opacity: 1, attr: { r: 5 }, duration: 0.25, ease: "power3.out" }, c.prism_label);
      draw("#d1-pr-line", c.prism_label + 0.12, 0.35, "power2.out");
      tl.fromTo("#d1-pr-plate", { opacity: 0, y: 20 }, { opacity: 1, y: 0, ...IN }, c.prism_label + 0.32);

      // angle：TS からプリズムへオレンジの線が 0.6秒でのびる
      draw("#d1-beam", c.angle, 0.6, "power2.inOut");
      draw("#d1-beam-glow", c.angle, 0.6, "power2.inOut");

      // distance：光の粒が TS→プリズム→TS を 0.5秒ずつで往復
      const d0 = c.distance;
      tl.fromTo("#d1-photon", { opacity: 0, x: tx, y: ty }, { opacity: 1, duration: 0.06, ease: "none" }, d0);
      tl.fromTo("#d1-photon", { x: tx, y: ty }, { x: px, y: py, duration: 0.5, ease: "power1.inOut", immediateRender: false }, d0);
      tl.fromTo("#d1-bounce", { opacity: 0.9, attr: { r: 14 } }, { opacity: 0, attr: { r: 40 }, duration: 0.4, ease: "power2.out" }, d0 + 0.5);
      tl.fromTo("#d1-photon", { x: px, y: py }, { x: tx, y: ty, duration: 0.5, ease: "power1.inOut", immediateRender: false }, d0 + 0.5);
      tl.fromTo("#d1-photon", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in", immediateRender: false }, d0 + 1.0);

      // to_paper：ラベルが消え、写真が紙に溶ける。TS＝紺△、プリズム＝オレンジ◎、オレンジの線だけ残る
      // to_paper：ラベルが消え、写真が紙に溶ける。TS＝紺△、プリズム＝オレンジ◎ が現れ、
      // 光の線をのばしたまま d2 の A・P の位置へひと続きに移る（d1 の最後のコマ ＝ d2 の最初のコマ）
      const A = [560, 760], P = [1380, 520];   // d2_topview の A・P と同じ
      const p0 = c.to_paper;
      const W = Math.max(0.5, dur - p0 - 0.05);
      tl.fromTo(["#d1-ts-plate", "#d1-pr-plate", "#d1-ts-lead", "#d1-pr-lead"], { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, p0);
      const pd = Math.max(0.35, Math.min(0.7, W * 0.6));
      tl.fromTo("#d1-paper", { opacity: 0 }, { opacity: 1, duration: pd, ease: "power2.inOut" }, p0 + 0.05);
      tl.fromTo("#d1-known", { x: tx, y: ty }, { x: tx, y: ty, duration: 0.01 }, 0);
      tl.fromTo("#d1-new", { x: px, y: py }, { x: px, y: py, duration: 0.01 }, 0);
      tl.fromTo("#d1-known-in", { opacity: 0, scale: 0.6, svgOrigin: "0 0" }, { opacity: 1, scale: 1, svgOrigin: "0 0", duration: 0.22, ease: "power3.out" }, p0 + 0.1);
      tl.fromTo("#d1-new-in", { opacity: 0, scale: 0.6, svgOrigin: "0 0" }, { opacity: 1, scale: 1, svgOrigin: "0 0", duration: 0.22, ease: "power3.out" }, p0 + 0.16);
      const g0 = p0 + 0.26, gd = Math.max(0.3, Math.min(0.9, W - 0.26));
      const G = { duration: gd, ease: "power2.inOut", immediateRender: false };
      tl.fromTo("#d1-known", { x: tx, y: ty }, { x: A[0], y: A[1], ...G }, g0);
      tl.fromTo("#d1-new", { x: px, y: py }, { x: P[0], y: P[1], ...G }, g0);
      tl.fromTo(["#d1-beam", "#d1-beam-glow"], { attr: { x1: tx, y1: ty, x2: px, y2: py } }, { attr: { x1: A[0], y1: A[1], x2: P[0], y2: P[1] }, ...G }, g0);

      tl.set({}, {}, dur);
      window.__timelines["d1_observe"] = tl;
    })();
  </script>
</template>
</body>
</html>
