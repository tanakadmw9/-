<html data-composition-variables='[{"id":"cues","type":"string","label":"cues","default":"{\"sight\":1.4,\"text_in\":2.4,\"sight_out\":3.4,\"reticle\":4.743,\"bg_in\":5.586,\"paper\":5.693,\"door\":6.493,\"lock\":8.033,\"fade\":9.645}"},{"id":"dur","type":"number","label":"dur","default":10.1435},{"id":"push_from","type":"number","label":"S10 の寄りの終わりの倍率","default":1.0225},{"id":"push_rate","type":"number","label":"寄りの速さ（毎秒）","default":0.004},{"id":"icon_x","type":"number","label":"章扉の水準測量アイコン x","default":650},{"id":"icon_y","type":"number","label":"章扉の水準測量アイコン y","default":470},{"id":"point_x","type":"number","label":"照準が現れる位置 x（2人の間の地面）","default":1600},{"id":"point_y","type":"number","label":"照準が現れる位置 y","default":760},{"id":"active","type":"number","label":"灯るアイコン","default":1},{"id":"lv_x","type":"number","label":"レベルの対物レンズ x（S 172.9– を 1920×1080 に拡大した座標）","default":1268},{"id":"lv_y","type":"number","label":"レベルの対物レンズ y","default":350},{"id":"st_x","type":"number","label":"遠くの標尺の目線の高さ x","default":884},{"id":"st_y","type":"number","label":"遠くの標尺の目線の高さ y","default":490}]'>
<body>
<template>
  <style>
    /* 締め（水準 v3）：S 172.9– の上で、B4 と同じオレンジの点線がレベルから遠くの標尺へ（ブックエンド。sight → sight_out で消える）
       → 締めの一文。以下は v1.3 のまま。 */
    /* 締め：S10 の上に締めの一文 → 2人の間の地面の一点に照準が合い、その場で縮む → 紙に溶けてから章扉の基準点アイコンへ戻る → 章扉の並びで閉じる → 黒へ */
    #root { position: absolute; inset: 0; background: transparent; overflow: hidden; }
    #ec-all { position: absolute; inset: 0; }
    #ec-bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; opacity: 0; }
    #ec-paper { position: absolute; inset: 0; background: var(--paper); opacity: 0; }
    #ec-grid { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #ec-grad { position: absolute; left: 0; right: 0; bottom: 0; height: 560px; opacity: 0;
      background: linear-gradient(to top,
        color-mix(in srgb, var(--ink) 82%, transparent) 0%,
        color-mix(in srgb, var(--ink) 55%, transparent) 45%,
        color-mix(in srgb, var(--ink) 0%, transparent) 100%); }

    .ec-item { position: absolute; top: 390px; width: 260px; margin-left: -130px; text-align: center; opacity: 0; }
    .ec-icon { display: block; width: 160px; height: 160px; margin: 0 auto; color: var(--navy); overflow: visible; }
    .ec-label { margin-top: 26px; font-family: var(--font-ja); font-weight: 400; font-size: 36px; line-height: 1.2;
      color: color-mix(in srgb, var(--ink) 72%, var(--paper)); font-feature-settings: "palt"; white-space: nowrap; }
    .ec-item.active .ec-icon { color: var(--orange); }
    .ec-item.active .ec-label { font-weight: 700; color: var(--ink); }

    /* 照準（title と同じ形。480px 角、円 r=118） */
    #ec-ret { position: absolute; width: 480px; height: 480px; opacity: 0; }
    #ec-ret svg { position: absolute; inset: 0; width: 480px; height: 480px; overflow: visible; }
    /* 章扉の照準アイコンと同じ形・同じ大きさの小さい照準（オレンジ＋白の縁）。大きい照準とクロスフェードして形をつなぐ */
    #ec-mini { position: absolute; width: 160px; height: 160px; opacity: 0; overflow: visible; }
    #ec-mini .mini-edge { stroke: var(--white); stroke-width: 9; }
    #ec-mini .mini-line { stroke: var(--orange); stroke-width: 4; }
    #ec-ret-shape * { vector-effect: non-scaling-stroke; }
    /* 明るい空の上でも見えるよう、タイトル・章扉と同じオレンジの線＋白の縁（編集 X3） */
    .ec-ret-edge { stroke: var(--white); stroke-width: 9; stroke-opacity: 0.9; fill: none; stroke-linecap: round; }
    .ec-ret-line { stroke: var(--orange); stroke-width: 4; fill: none; stroke-linecap: round; }

    /* 締めの一文：左下、2行、72px */
    #ec-text { position: absolute; left: 132px; top: 790px; opacity: 0; }
    .ec-line { font-family: var(--font-ja); font-weight: 700; font-size: 72px; line-height: 1.3; color: var(--white);
      font-feature-settings: "palt"; white-space: nowrap; letter-spacing: 0.02em; }
    /* 2行目の頭の “ を左へぶら下げ、1行目と文字の左端をそろえる */
    #ec-text .ec-ink { position: absolute; left: 0; top: 0; opacity: 0; }
    #ec-text .ec-ink .ec-line { color: var(--ink); }
    /* 仮ナレのクレジット（VOICEVOX の規約で表示が必要。本ナレに差し替えたら消す） */
    #ec-credit { position: absolute; right: 132px; bottom: 72px; opacity: 0; font-family: var(--font-ja); font-weight: 400;
      font-size: 34px; line-height: 1.2; white-space: nowrap; }
    #ec-credit span { color: var(--sub); }
    /* 白の文字は幅をとるためだけに置く（実写の上には出さない：デザイン G6）。紙の上の紺の文字だけを見せる */
    #ec-credit > span:first-child { opacity: 0; }
    #ec-credit .ec-ink { position: absolute; right: 0; top: 0; opacity: 0; color: color-mix(in srgb, var(--ink) 80%, var(--paper)); }
    #ec-halo { position: absolute; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%;
      background: color-mix(in srgb, var(--orange) 16%, transparent); opacity: 0; }
    #ec-black { position: absolute; inset: 0; background: #000; opacity: 0; }
    #ec-sight-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="endcard" data-width="1920" data-height="1080">
    <div id="ec-all">
      <img id="ec-bg" src="assets/video/L10_last.png" alt="">
      <!-- 目線の点線（k_sight と同じ形）：人の頭と顔を通らない（レベル → 胸の高さで遠くの標尺へ） -->
      <svg id="ec-sight-svg" viewBox="0 0 1920 1080" aria-hidden="true">
        <g id="ec-sight">
          <line id="ec-sight-edge" stroke="var(--navy)" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 20" opacity="0.6"/>
          <line id="ec-sight-line" stroke="var(--orange)" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 20"/>
          <g id="ec-tick" opacity="0">
          <circle id="ec-tick-h" r="14" fill="none" stroke="var(--navy)" stroke-width="9" opacity="0.6"/>
          <circle id="ec-tick-o" r="14" fill="none" stroke="var(--orange)" stroke-width="5"/>
        </g>
        </g>
      </svg>
      <div id="ec-grad"></div>
      <div id="ec-paper">
        <svg id="ec-grid" viewBox="0 0 1920 1080" aria-hidden="true"><g id="ec-grid-lines" stroke="var(--grid)" stroke-width="1.5"></g></svg>
      </div>
      <div id="ec-halo"></div>
      <div id="ec-items"></div>
      <div id="ec-ret">
        <svg viewBox="0 0 480 480" aria-hidden="true">
          <defs>
            <g id="ec-ret-shape">
              <circle cx="240" cy="240" r="118"/>
              <path d="M40 240H204M276 240H440M240 40V204M240 276V440"/>
              <path d="M88 232V248M142 234V246M338 234V246M392 232V248M232 88H248M234 142H246M234 338H246M232 392H248"/>
              <path d="M226 186H254M226 294H254M186 226V254M294 226V254"/>
            </g>
          </defs>
          <use href="#ec-ret-shape" class="ec-ret-edge" id="ec-ret-edge" vector-effect="non-scaling-stroke"/>
          <use href="#ec-ret-shape" class="ec-ret-line" id="ec-ret-line" vector-effect="non-scaling-stroke"/>
          <circle id="ec-ret-dot" cx="240" cy="240" r="9" fill="var(--orange)" stroke="var(--white)" stroke-width="3" opacity="0"/>
        </svg>
      </div>
<svg id="ec-mini" viewBox="0 0 96 96" fill="none" stroke-linecap="round" aria-hidden="true">
      <g class="mini-edge"><circle cx="48" cy="48" r="28"/><path d="M48 8v20M48 68v20M8 48h20M68 48h20"/></g>
      <g class="mini-line"><circle cx="48" cy="48" r="28"/><path d="M48 8v20M48 68v20M8 48h20M68 48h20"/><path d="M48 20v4M48 72v4M20 48h4M72 48h4" stroke-width="2"/></g>
    </svg>
      <div id="ec-text">
        <div class="ec-line">目に見えない“高さ”を、</div>
        <div class="ec-line">つないでいく</div>
        <div class="ec-ink"><div class="ec-line">目に見えない“高さ”を、</div><div class="ec-line">つないでいく</div></div>
      </div>
      <div id="ec-credit"><span>ナレーション（仮）　VOICEVOX:冥鳴ひまり</span><span class="ec-ink">ナレーション（仮）　VOICEVOX:冥鳴ひまり</span></div>
    </div>
    <div id="ec-black"></div>
  </div>
  <script>
    (function () {
      const v = window.__hyperframes.getVariables();
      const c = JSON.parse(v.cues);
      const dur = Number(v.dur);
      const active = Number(v.active || 0);
      const cs = getComputedStyle(document.documentElement);
      const tok = (n, fb) => (cs.getPropertyValue(n) || "").trim() || fb;

      // 章扉と同じ方眼・同じアイコンの並び（chapter_door.html と同じ座標）
      const g = document.getElementById("ec-grid-lines");
      let d = "";
      for (let x = 0; x <= 1920; x += 60) d += `M${x} 0V1080`;
      for (let y = 0; y <= 1080; y += 60) d += `M0 ${y}H1920`;
      g.innerHTML = `<path d="${d}"/>`;
      const JOBS = [
        ["基準点測量", '<rect x="35" y="22" width="26" height="28" rx="4"/><circle cx="48" cy="33" r="6"/><path d="M41 44h14"/><path d="M33 54h30"/><path d="M39 56 24 88M57 56l15 32M48 56v32"/>'],
        ["水準測量", '<rect x="16" y="42" width="34" height="12" rx="3"/><path d="M33 54v4M22 60h22M28 62l-8 26M38 62l8 26M33 62v26"/><path d="M54 48h12" stroke-dasharray="3 6"/><rect x="70" y="12" width="14" height="76" rx="2"/><path d="M70 24h7M70 36h7M70 48h7M70 60h7M70 72h7"/>'],
        ["地形測量", '<path d="M14 60C14 34 40 18 58 22 78 26 86 44 80 62 74 80 48 84 32 80 20 77 14 70 14 60Z"/><path d="M28 58C28 42 44 32 56 35 68 38 72 50 68 60 64 70 48 72 38 70 31 68 28 64 28 58Z"/><path d="M43 55C43 48 50 45 55 47 60 49 60 56 56 59 52 62 43 61 43 55Z"/>'],
        ["路線測量", '<path d="M16 88 40 10M80 88 56 10"/><path d="M48 84v-12M48 60v-10M48 40v-8M48 22v-6"/>'],
        ["用地測量", '<path d="M18 30 58 16 82 46 62 82 22 72Z"/><rect x="13" y="25" width="10" height="10" rx="1" fill="currentColor"/><rect x="53" y="11" width="10" height="10" rx="1" fill="currentColor"/><rect x="77" y="41" width="10" height="10" rx="1" fill="currentColor"/><rect x="57" y="77" width="10" height="10" rx="1" fill="currentColor"/><rect x="17" y="67" width="10" height="10" rx="1" fill="currentColor"/>'],
      ];
      const XS = [340, 650, 960, 1270, 1580];
      const host = document.getElementById("ec-items");
      JOBS.forEach(([name, paths], i) => {
        const el = document.createElement("div");
        el.className = "ec-item" + (i === active ? " active" : "");
        el.id = "ec-item-" + i;
        el.style.left = XS[i] + "px";
        el.innerHTML = `<svg class="ec-icon" viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${paths}</svg><div class="ec-label">${name}</div>`;
        host.appendChild(el);
      });

      const px = Number(v.point_x), py = Number(v.point_y), ix = Number(v.icon_x), iy = Number(v.icon_y);
      const ret = document.getElementById("ec-ret");
      ret.style.left = (px - 240) + "px"; ret.style.top = (py - 240) + "px";
      const S_ICON = 0.396;   // 章扉の照準アイコン（160px、円 r=46.7）と同じ大きさ

      const tl = gsap.timeline({ paused: true });

      // sight：本物のレベルから遠くの標尺へオレンジの点線が 0.6 秒で伸び、先に小さな印（B4 k_sight と同じ）。
      //        紙に溶ける前（sight_out。無ければ paper の 0.5 秒前まで）に 0.3 秒で消える
      if (c.sight != null) {
        const lx = Number(v.lv_x), ly = Number(v.lv_y), sx = Number(v.st_x), sy = Number(v.st_y);
        ["#ec-sight-line", "#ec-sight-edge"].forEach((sel) => { const e = document.querySelector(sel);
          e.setAttribute("x1", lx); e.setAttribute("y1", ly); e.setAttribute("x2", lx); e.setAttribute("y2", ly); });
        const tk = document.querySelector("#ec-tick");
        ["#ec-tick-h", "#ec-tick-o"].forEach((t) => { const e = document.querySelector(t); e.setAttribute("cx", sx); e.setAttribute("cy", sy); });
        tl.fromTo(["#ec-sight-line", "#ec-sight-edge"], { attr: { x2: lx, y2: ly } }, { attr: { x2: sx, y2: sy }, duration: 0.6, ease: "power2.inOut" }, c.sight);
        tl.fromTo("#ec-tick", { opacity: 0, scale: 0.3, svgOrigin: sx + " " + sy }, { opacity: 1, scale: 1, svgOrigin: sx + " " + sy, duration: 0.3, ease: "power3.out" }, c.sight + 0.55);
        // 実写のごく弱い寄り（bg_in で push_from に達する、毎秒 push_rate）に点線もそろえる
        if (c.bg_in != null) tl.fromTo("#ec-sight-svg", { scale: Number(v.push_from) - Number(v.push_rate) * c.bg_in, transformOrigin: "50% 40%" },
          { scale: Number(v.push_from), transformOrigin: "50% 40%", duration: c.bg_in, ease: "none" }, 0);
        const pp = c.paper != null ? c.paper : c.door - 0.45;
        const so = Math.min(c.sight_out != null ? c.sight_out : c.sight + 2.2, pp - 0.5, (c.bg_in != null ? c.bg_in : pp) - 0.35);
        tl.fromTo("#ec-sight", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, Math.max(c.sight + 0.9, so));
      }

      // text_in：S10 の上に締めの一文（左下）。下からの紺のグラデーションで守る
      tl.fromTo("#ec-grad", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, c.text_in - 0.1);
      tl.fromTo("#ec-text", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, c.text_in);

      // bg_in：S10 の最後のコマ。S10 と同じ中心・同じ速さで寄り続ける（止まって見えないように）
      const bgDur = Math.max(0.1, dur - c.bg_in);
      tl.set("#ec-bg", { opacity: 1 }, c.bg_in);
      tl.fromTo("#ec-bg", { scale: Number(v.push_from), transformOrigin: "50% 40%" },
        { scale: Number(v.push_from) + Number(v.push_rate) * bgDur, transformOrigin: "50% 40%", duration: bgDur, ease: "none", immediateRender: false }, c.bg_in);

      // reticle：2人の間の地面の一点に照準が現れ、中心の点が灯る（照準は「点」をねらう。人にはかけない：独立レビュー v4.7）
      tl.fromTo(ret, { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, c.reticle);
      tl.fromTo("#ec-ret-dot", { opacity: 0, scale: 1.35, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "power3.out" }, c.reticle + 0.35);
      // その場で縮み、章扉のアイコンと同じ大きさの小さい照準に替わる（動かない＝人の上を通らない）
      const paper = c.paper != null ? c.paper : c.door - 0.45;
      const mini = document.getElementById("ec-mini");
      mini.style.left = (px - 80) + "px"; mini.style.top = (py - 80) + "px";
      const m0 = c.reticle + 0.6, sh = Math.max(0.4, paper + 0.1 - m0);
      tl.fromTo(ret, { scale: 1 }, { scale: S_ICON, duration: sh, ease: "power2.inOut", immediateRender: false }, m0);
      tl.fromTo(mini, { scale: 1 / S_ICON }, { scale: 1, duration: sh, ease: "power2.inOut" }, m0);
      tl.fromTo(mini, { opacity: 0 }, { opacity: 1, duration: sh * 0.4, ease: "power1.inOut" }, m0 + sh * 0.4);
      tl.to(ret, { opacity: 0, duration: sh * 0.4, ease: "power1.inOut" }, m0 + sh * 0.4);

      // paper：紙と方眼が戻る。紙がほぼ覆ってから、小さい照準が章扉のアイコンの位置へ動く
      tl.fromTo("#ec-paper", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, paper);
      tl.fromTo("#ec-grad", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, paper);
      tl.fromTo("#ec-text .ec-ink", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, paper);
      const mv0 = paper + 0.5, mv = Math.max(0.3, c.door + 0.1 - mv0);   // 紙が覆いきってから動かす（水準 v1.3：独立レビュー v1.2）
      tl.fromTo(mini, { x: 0, y: 0 }, { x: ix - px, y: iy - py, duration: mv, ease: "power2.inOut" }, mv0);
      // 仮ナレのクレジットは紙の上だけに出す（締めの一文と同時に読ませない：デザイン G6）
      tl.set("#ec-credit", { opacity: 1 }, paper);
      tl.fromTo("#ec-credit .ec-ink", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, c.door + 0.2);
      tl.to("#ec-text > .ec-line", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, paper + 0.2);   // 紺の文字が出てから白を消す（一瞬消えるのを防ぐ）

      // door：章扉の並びがそろう。照準は灯ったアイコンに変わる（言葉「基準点測量」）
      tl.to(mini, { opacity: 0, duration: 0.25, ease: "power2.in" }, c.door + 0.05);
      tl.fromTo("#ec-item-" + active, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, c.door);
      JOBS.forEach((_, i) => {
        if (i !== active) tl.fromTo("#ec-item-" + i, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          c.door + 0.15 + Math.abs(i - active) * 0.08);
      });

      // 灯り：章扉と同じオレンジの光の輪。lock（文の終わり、効果音「ピッ」）でもう一度ふくらむ
      const hl = document.getElementById("ec-halo");
      hl.style.left = ix + "px"; hl.style.top = iy + "px";
      tl.fromTo(hl, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, c.door + 0.1);
      if (c.lock != null) {
        tl.fromTo(hl, { scale: 1 }, { scale: 1.18, duration: 0.18, ease: "power2.out", immediateRender: false }, c.lock);
        tl.to(hl, { scale: 1, duration: 0.4, ease: "power2.inOut" }, c.lock + 0.18);
      }

      // fade：最後の 0.5 秒で黒へ（場面の終わりの 2 コマ前に完全な黒）
      const fd = Math.max(0.3, Math.min(0.5, dur - 0.07 - c.fade));
      tl.fromTo("#ec-black", { opacity: 0 }, { opacity: 1, duration: fd, ease: "power1.inOut" }, c.fade);
      tl.set({}, {}, dur);
      window.__timelines["endcard"] = tl;
    })();
  </script>
</template>
</body>
