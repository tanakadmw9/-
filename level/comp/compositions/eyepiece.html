<html data-composition-variables='[{"id":"cues","type":"string","label":"cues","default":"{\"in\":0.033,\"stop\":0.586,\"focus\":1.086,\"band\":1.297}"},{"id":"dur","type":"number","label":"dur","default":2.528}]'>
<body>
<template>
  <style>
    /* B7 eyepiece（editing_v8.md §3.2、40.447–42.975）：望遠鏡の中の円（直径 820、縁はうすい紺 6px）。円の外は深い紺 #0E1A2B。人も写真も重ねない。
       円の中：白地の標尺（幅 300、E の字の目盛り、数字は描かない）、十字線は黒 2px、横線の上下に短いスタジア線。
       ぼけた標尺が少し右から横に来て縦の線で止まる → ピント → 「読んで」で横の線のところにうすい光の帯（高さ 8px）0.3 秒。音なし。
       撮り足し②（接眼にスマホを当てた本物）が来たら、この 2.53 秒と替える */
    #root { position: absolute; inset: 0; overflow: hidden; background: #0E1A2B; }
    #ep-circle { position: absolute; left: 550px; top: 130px; width: 820px; height: 820px; border-radius: 50%; overflow: hidden; background: #EDEDE8; }
    #ep-staff { position: absolute; left: 260px; top: -40px; width: 300px; height: 900px; background: #FFFFFF; }
    #ep-staff svg { width: 300px; height: 900px; }
    #ep-band { position: absolute; left: 0; top: 406px; width: 820px; height: 8px; background: rgba(255, 196, 120, 0.75); opacity: 0; }
    #ep-cross { position: absolute; left: 0; top: 0; width: 820px; height: 820px; }
    #ep-ring { position: absolute; left: 547px; top: 127px; width: 826px; height: 826px; border-radius: 50%; box-sizing: border-box;
      border: 6px solid #6B83A6; }
  </style>
  <div id="root" data-composition-id="eyepiece" data-width="1920" data-height="1080">
    <div id="ep-circle">
      <div id="ep-staff"><svg viewBox="0 0 300 900" id="ep-marks"></svg></div>
      <div id="ep-band"></div>
      <svg id="ep-cross" viewBox="0 0 820 820">
        <line x1="0" y1="410" x2="820" y2="410" stroke="#111" stroke-width="2"/>
        <line x1="410" y1="0" x2="410" y2="820" stroke="#111" stroke-width="2"/>
        <line x1="360" y1="330" x2="460" y2="330" stroke="#111" stroke-width="2"/>
        <line x1="360" y1="490" x2="460" y2="490" stroke="#111" stroke-width="2"/>
      </svg>
    </div>
    <div id="ep-ring"></div>
  </div>
  <script>
    (function () {
      const v = window.__hyperframes.getVariables();
      const c = JSON.parse(v.cues);
      // E の字の目盛り（5 cm ごと、赤と黒を 3 つずつ。数字は描かない）
      const m = document.getElementById("ep-marks"); let s = "";
      for (let i = 0, y = 10; y < 900; i++, y += 100) {
        const col = Math.floor(i / 3) % 2 === 0 ? "#C8322B" : "#222222";
        s += `<rect x="40" y="${y}" width="16" height="50" fill="${col}"/><rect x="40" y="${y}" width="90" height="12" fill="${col}"/>` +
             `<rect x="40" y="${y + 19}" width="60" height="12" fill="${col}"/><rect x="40" y="${y + 38}" width="90" height="12" fill="${col}"/>`;
      }
      m.innerHTML = s;
      const tl = gsap.timeline({ paused: true });
      // 標尺が少し右から横に来て、縦の線で止まる（ぼけたまま）→ ピント
      tl.fromTo("#ep-staff", { x: 260, filter: "blur(9px)" }, { x: 0, duration: c.stop - c.in, ease: "power2.out" }, c.in);
      tl.fromTo("#ep-staff", { filter: "blur(9px)" }, { filter: "blur(0px)", duration: c.focus - c.stop, ease: "power1.inOut", immediateRender: false }, c.stop);
      tl.fromTo("#ep-circle", { scale: 0.96 }, { scale: 1, duration: c.focus - c.in, ease: "power2.out" }, c.in);
      // 「読んで」：横の線のところにうすい光の帯 0.3 秒
      tl.fromTo("#ep-band", { opacity: 0 }, { opacity: 1, duration: 0.08 }, c.band);
      tl.to("#ep-band", { opacity: 0, duration: 0.22 }, c.band + 0.3);
      tl.set({}, {}, v.dur || c.band + 1);
      window.__timelines["eyepiece"] = tl;
    })();
  </script>
</template>
</body>
</html>
