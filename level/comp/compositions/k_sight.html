<html data-composition-variables='[{"id":"cues","type":"string","label":"cues","default":"{\"level\":0.35,\"line\":1.25,\"staff\":1.9,\"out\":3.45}"},{"id":"dur","type":"number","label":"dur","default":3.8038},{"id":"lv_x","type":"number","label":"レベルの対物レンズ x","default":1060},{"id":"lv_y","type":"number","label":"レベルの対物レンズ y","default":382},{"id":"st_x","type":"number","label":"遠くの標尺の目線の高さ x","default":712},{"id":"st_y","type":"number","label":"遠くの標尺の目線の高さ y","default":462},{"id":"lvd_x","type":"number","label":"レベルのラベルの点 x","default":1078},{"id":"lvd_y","type":"number","label":"レベルのラベルの点 y","default":372},{"id":"lvp_x","type":"number","label":"レベルの板 左 x","default":600},{"id":"lvp_y","type":"number","label":"レベルの板 上 y","default":112},{"id":"std_x","type":"number","label":"標尺のラベルの点 x（手より下の見えている標尺）","default":710},{"id":"std_y","type":"number","label":"標尺のラベルの点 y","default":585},{"id":"stp_x","type":"number","label":"標尺の板 左 x","default":140},{"id":"stp_y","type":"number","label":"標尺の板 上 y","default":640}]'>
<body>
<template>
  <style>
    /* B4 k_sight（K の引き 3.8–7.6 の上。透明）：対象ラベル「レベル」「標尺」（基準点 d1_observe と同じ型：点→白の引き出し線→紺の板）
       → 本物のレベルの対物レンズから、遠くの本物の標尺へオレンジの点線（目線＝水平な線）。
       実線にしないのは、前のパートの TS の光の線と区別するため。点線の先に標尺の上の小さな印。 */
    #root { position: absolute; inset: 0; background: transparent; }
    #ks-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    .ks-plate { position: absolute; background: var(--plate); border-radius: var(--plate-radius);
      padding: 16px 28px 18px; font-feature-settings: "palt"; white-space: nowrap; opacity: 0; box-sizing: border-box; height: 150px; }
    #ks-lv-plate { width: 370px; }
    #ks-st-plate { width: 470px; }
    .ks-main { font-family: var(--font-ja); font-weight: 700; font-size: 48px; line-height: 1.3; color: var(--white); }
    .ks-sub { font-family: var(--font-ja); font-weight: 400; font-size: 36px; line-height: 1.35; color: var(--sub); margin-top: 4px; }
  </style>
  <div id="root" data-composition-id="k_sight" data-width="1920" data-height="1080">
    <svg id="ks-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <g id="ks-lv-lead" opacity="0">
        <line id="ks-lv-line" stroke="var(--white)" stroke-width="2" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110"/>
        <circle id="ks-lv-dot" r="5" fill="var(--white)"/>
      </g>
      <g id="ks-st-lead" opacity="0">
        <line id="ks-st-line" stroke="var(--white)" stroke-width="2" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110"/>
        <circle id="ks-st-dot" r="5" fill="var(--white)"/>
      </g>
      <!-- 目線：オレンジの点線（直径10px の丸い点、20px おき）。下に紺の縁（約2px、60%）で、空でも道路でも点が見えるように。先に小さなオレンジの輪 -->
      <g id="ks-sight">
        <line id="ks-sight-edge" stroke="var(--navy)" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 20" opacity="0.6"/>
        <line id="ks-sight-line" stroke="var(--orange)" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 20"/>
        <g id="ks-tick" opacity="0">
          <circle id="ks-tick-h" r="14" fill="none" stroke="var(--navy)" stroke-width="9" opacity="0.6"/>
          <circle id="ks-tick-o" r="14" fill="none" stroke="var(--orange)" stroke-width="5"/>
        </g>
      </g>
    </svg>
    <div id="ks-lv-plate" class="ks-plate">
      <div class="ks-main">レベル</div>
      <div class="ks-sub">高さをはかる機械</div>
    </div>
    <div id="ks-st-plate" class="ks-plate">
      <div class="ks-main">標尺</div>
      <div class="ks-sub">ものさし</div>
    </div>
  </div>
  <script>
    (function () {
      const v = window.__hyperframes.getVariables();
      const c = JSON.parse(v.cues);
      const dur = Number(v.dur) || 3.8;
      const N = (k) => Number(v[k]);
      const q = (s) => document.querySelector(s);
      const setA = (s, o) => { const el = q(s); for (const k in o) el.setAttribute(k, o[k]); };
      const lx = N("lv_x"), ly = N("lv_y"), sx = N("st_x"), sy = N("st_y");

      // 板の位置と、引き出し線の行き先（板のいちばん近い辺の中ほど）
      const lp = q("#ks-lv-plate"), sp = q("#ks-st-plate");
      lp.style.left = N("lvp_x") + "px"; lp.style.top = N("lvp_y") + "px";
      sp.style.left = N("stp_x") + "px"; sp.style.top = N("stp_y") + "px";
      const near = (el, px, py) => {
        const L = parseFloat(el.style.left), T = parseFloat(el.style.top), W = el === lp ? 370 : 470, H = 150;   // 板の大きさは CSS と同じ固定値（フォントの読み込み前でも線がずれない）
        const cx = Math.max(L + 24, Math.min(L + W - 24, px)), cy = Math.max(T + 18, Math.min(T + H - 18, py));
        // 点が板の外のどちら側にあるかで、辺の上の点を決める
        if (py > T + H) return [cx, T + H];
        if (py < T) return [cx, T];
        return [px < L ? L : L + W, cy];
      };
      const ldx = N("lvd_x"), ldy = N("lvd_y"), sdx = N("std_x"), sdy = N("std_y");
      const le = near(lp, ldx, ldy), se = near(sp, sdx, sdy);
      setA("#ks-lv-line", { x1: ldx, y1: ldy, x2: le[0], y2: le[1] });
      setA("#ks-lv-dot", { cx: ldx, cy: ldy });
      setA("#ks-st-line", { x1: sdx, y1: sdy, x2: se[0], y2: se[1] });
      setA("#ks-st-dot", { cx: sdx, cy: sdy });
      ["#ks-sight-line", "#ks-sight-edge"].forEach((s) => setA(s, { x1: lx, y1: ly, x2: lx, y2: ly }));
      ["#ks-tick-h", "#ks-tick-o"].forEach((t) => setA(t, { cx: sx, cy: sy }));

      const tl = gsap.timeline({ paused: true });
      const IN = { duration: 0.5, ease: "power3.out" };
      const draw = (s, at) => tl.fromTo(s, { attr: { "stroke-dashoffset": 110 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.out" }, at);

      // level：点 → 引き出し線 → 板「レベル／高さをはかる機械」
      tl.fromTo("#ks-lv-lead", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, c.level);
      tl.fromTo("#ks-lv-dot", { attr: { r: 2 } }, { attr: { r: 5 }, duration: 0.25, ease: "power3.out" }, c.level);
      draw("#ks-lv-line", c.level + 0.05);
      tl.fromTo(lp, { opacity: 0, y: 20 }, { opacity: 1, y: 0, ...IN }, c.level + 0.15);

      // line：対物レンズから遠くの標尺へ、オレンジの点線が 0.6 秒で伸びる → 標尺の上に小さな印
      tl.fromTo(["#ks-sight-line", "#ks-sight-edge"], { attr: { x2: lx, y2: ly } }, { attr: { x2: sx, y2: sy }, duration: 0.6, ease: "power2.inOut" }, c.line);
      tl.fromTo("#ks-tick", { opacity: 0, scale: 0.3, svgOrigin: sx + " " + sy }, { opacity: 1, scale: 1, svgOrigin: sx + " " + sy, duration: 0.3, ease: "power3.out" }, c.line + 0.55);

      // staff：点（手より下の見えている標尺）→ 引き出し線 → 板「標尺／ものさし」（v2.2：声と同じ言葉。長い補足は読み切れない）
      tl.fromTo("#ks-st-lead", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, c.staff);
      tl.fromTo("#ks-st-dot", { attr: { r: 2 } }, { attr: { r: 5 }, duration: 0.25, ease: "power3.out" }, c.staff);
      draw("#ks-st-line", c.staff + 0.05);
      tl.fromTo(sp, { opacity: 0, y: 20 }, { opacity: 1, y: 0, ...IN }, c.staff + 0.15);

      // out：ラベル → 点線の順に 0.3 秒で消える（次はのぞく顔の寄り）
      const o = c.out != null ? c.out : dur - 0.35;
      const OUT = { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false };
      tl.fromTo([lp, sp, "#ks-lv-lead", "#ks-st-lead"], { opacity: 1 }, OUT, o);
      tl.fromTo("#ks-sight", { opacity: 1 }, OUT, o + 0.05);

      tl.set({}, {}, dur);
      window.__timelines["k_sight"] = tl;
    })();
  </script>
</template>
</body>
</html>
