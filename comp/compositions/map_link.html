<g class="known" id="ml-known-2"><path d="M620.0 268.0 L651.9 319.8 L588.1 319.8Z"/><circle cx="620" cy="305" r="6" fill="#1F3A5F" stroke="none"/></g>
<g class="known" id="ml-known-3"><path d="M1040.0 728.0 L1071.9 779.8 L1008.1 779.8Z"/><circle cx="1040" cy="765" r="6" fill="#1F3A5F" stroke="none"/></g>

<g class="known" id="ml-known-5"><path d="M1240.0 298.0 L1271.9 349.8 L1208.1 349.8Z"/><circle cx="1240" cy="335" r="6" fill="#1F3A5F" stroke="none"/></g>
</g>
<g id="ml-new-point" fill="none" stroke="#E8742A" stroke-width="5"><circle cx="820" cy="600" r="24"/><circle cx="820" cy="600" r="9" fill="#E8742A" stroke="none"/></g>
<g id="ml-new-tri" opacity="0" fill="#F4F1EA" stroke="#E8742A" stroke-width="5" stroke-linejoin="round"><path d="M820.0 563.0 L851.9 614.8 L788.1 614.8Z"/><circle cx="820" cy="600" r="6" fill="#E8742A" stroke="none"/></g>
        </g>
        <g id="ml-leads" stroke="#14202E" stroke-width="2.5" stroke-linecap="round" fill="#14202E">
          <g id="ml-lead-map" opacity="0"><line x1="376" y1="462" x2="598" y2="548"/><circle cx="598" cy="548" r="6" stroke="none"/></g>
          <g id="ml-lead-road" opacity="0"><line x1="1424" y1="602" x2="1427" y2="530"/><circle cx="1427" cy="526" r="6" stroke="none"/></g>
        </g>
      </svg>
      <div id="ml-lbl-np" class="ml-lbl" style="color: var(--orange-dark); font-size: 40px;">新しい基準点</div>
      <div id="ml-lbl-map" class="ml-lbl">地図</div>
      <div id="ml-lbl-road" class="ml-lbl">道路の図面</div>
      </div>
      </div>
      <div id="ml-band"></div>
      <svg id="ml-arcs" viewBox="0 0 1920 270" aria-hidden="true" fill="none" stroke="var(--orange)" stroke-width="4" stroke-linecap="round">
        <path id="ml-arc-0" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="100" d="M340 108 C500 78,800 78,960 108"/>
        <circle id="ml-arc-src" cx="340" cy="108" r="6" fill="var(--orange)" stroke="none" opacity="0"/>
        <path id="ml-arc-1" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="100" d="M340 108 C560 22,1050 22,1270 108"/>
      </svg>
      <div id="ml-items"></div>
    </div>
  </div>
  <script>
    (function () {
      const v = window.__hyperframes.getVariables();
      const c = JSON.parse(v.cues);
      const dur = Number(v.dur);
      const active = Number(v.active || 0);
      const cs = getComputedStyle(document.documentElement);
      const tok = (n, fb) => (cs.getPropertyValue(n) || "").trim() || fb;
      const NAVY = tok("--navy", "#1F3A5F"), ORANGE = tok("--orange", "#E8742A");

      // 章扉と同じアイコン（小さめ、紙の帯の上）。この順番は chapter_door.html と同じ
      const JOBS = [
        ["基準点測量", '<rect x="35" y="22" width="26" height="28" rx="4"/><circle cx="48" cy="33" r="6"/><path d="M41 44h14"/><path d="M33 54h30"/><path d="M39 56 24 88M57 56l15 32M48 56v32"/>'],
        ["水準測量", '<rect x="16" y="42" width="34" height="12" rx="3"/><path d="M33 54v4M22 60h22M28 62l-8 26M38 62l8 26M33 62v26"/><path d="M54 48h12" stroke-dasharray="3 6"/><rect x="70" y="12" width="14" height="76" rx="2"/><path d="M70 24h7M70 36h7M70 48h7M70 60h7M70 72h7"/>'],
        ["地形測量", '<path d="M14 60C14 34 40 18 58 22 78 26 86 44 80 62 74 80 48 84 32 80 20 77 14 70 14 60Z"/><path d="M28 58C28 42 44 32 56 35 68 38 72 50 68 60 64 70 48 72 38 70 31 68 28 64 28 58Z"/><path d="M43 55C43 48 50 45 55 47 60 49 60 56 56 59 52 62 43 61 43 55Z"/>'],
        ["路線測量", '<path d="M16 88 40 10M80 88 56 10"/><path d="M48 84v-12M48 60v-10M48 40v-8M48 22v-6"/>'],
        ["用地測量", '<path d="M18 30 58 16 82 46 62 82 22 72Z"/><rect x="13" y="25" width="10" height="10" rx="1" fill="currentColor"/><rect x="53" y="11" width="10" height="10" rx="1" fill="currentColor"/><rect x="77" y="41" width="10" height="10" rx="1" fill="currentColor"/><rect x="57" y="77" width="10" height="10" rx="1" fill="currentColor"/><rect x="17" y="67" width="10" height="10" rx="1" fill="currentColor"/>'],
      ];
      const XS = [340, 650, 960, 1270, 1580];
      const USERS = [2, 3];   // 基準点を使う作業として線をのばす先：地形測量（地図）・路線測量（道路の図面）
      const host = document.getElementById("ml-items");
      JOBS.forEach(([name, paths], i) => {
        const el = document.createElement("div");
        el.className = "ml-item" + (i === active ? " on" : "");
        el.id = "ml-item-" + i;
        el.style.left = XS[i] + "px";
        el.innerHTML = `<svg class="ml-icon" id="ml-icon-${i}" viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${paths}</svg><div class="ml-label">${name}</div>`;
        host.appendChild(el);
      });
      document.getElementById("ml-icon-" + active).style.color = ORANGE;

      const tl = gsap.timeline({ paused: true });
      const NP = "820 600";   // 新しい点（D2 の P）の位置

      // dissolve：草原が地図の紙へ溶ける（約1.3秒）。最初は新しい点に寄った状態
      tl.fromTo("#ml-all", { opacity: 0 }, { opacity: 1, duration: 1.3, ease: "power1.inOut" }, c.dissolve);
      gsap.set("#ml-known-points .known", { opacity: 0 });
      tl.fromTo("#ml-zoom", { scale: 1.6, svgOrigin: NP }, { scale: 1.6, svgOrigin: NP, duration: 0.01 }, 0);

      // points：引くと、まわりの基準点が見えてくる（新しい点もその一つ）
      tl.fromTo("#ml-zoom", { scale: 1.6, svgOrigin: NP }, { scale: 1, svgOrigin: NP, duration: 1.3, ease: "power2.inOut", immediateRender: false }, c.points);
      gsap.utils.toArray("#ml-known-points .known").forEach((el, i) => {
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power3.out" }, c.points + 0.35 + i * 0.1);
      });
      // 既知点 → 新しい点 → 別の既知点 と1本ずつつなぐ（ほかの目印ともつないで確かめる。結合の形：監修 K2）
      ["#ml-link-0", "#ml-link-1"].forEach((id, i) => {
        const el = document.querySelector(id); const L = el.getTotalLength();
        tl.fromTo(el, { attr: { "stroke-dasharray": `0 ${L}` } }, { attr: { "stroke-dasharray": `${L} 0` }, duration: 0.35, ease: "power2.inOut" }, c.points + 0.55 + i * 0.35);
        tl.set(el, { attr: { "stroke-dasharray": "6 11" } }, c.points + 0.55 + i * 0.35 + 0.36);
      });
      // つながったら、新しい点も「基準点」に（◎ → オレンジの△）。名前の札は「地図」が描かれる前に消す
      const nb = c.points + 1.25;
      tl.to("#ml-new-point", { opacity: 0, duration: 0.3, ease: "power2.in" }, nb);
      tl.fromTo("#ml-new-tri", { opacity: 0, scale: 0.6, svgOrigin: NP }, { opacity: 1, scale: 1, svgOrigin: NP, duration: 0.4, ease: "power3.out" }, nb + 0.1);
      tl.fromTo("#ml-lbl-np", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, nb + 0.15);
      // 消すのは道路の線が札の位置（x≈860）に来る少し前。6字＝2.5秒を確保（独立レビュー v4.7）
      tl.to("#ml-lbl-np", { opacity: 0, duration: 0.3, ease: "power2.in" }, c.road + 0.2);

      // contours：「地図」の言葉で等高線がすっと描かれる
      gsap.utils.toArray("#ml-contours .contour").forEach((el, i) => {
        tl.fromTo(el, { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.0, ease: "power2.inOut" }, c.contours + i * 0.03);
      });
      tl.fromTo("#ml-lead-map", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, c.contours + 0.25);
      tl.fromTo("#ml-lbl-map", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, c.contours + 0.3);

      // road：「道路の図面」の言葉で道路の線が左からのびる
      tl.fromTo("#ml-road-clip-rect", { attr: { width: 0 } }, { attr: { width: 1920 }, duration: 1.0, ease: "power2.inOut" }, c.road);
      tl.fromTo("#ml-lead-road", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, c.road + 0.35);
      tl.fromTo("#ml-lbl-road", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, c.road + 0.4);

      // icons：章扉のアイコン列が上から下りてくる（20小節頭）。帯が地図を 100px 押し下げる（一番上の△が「水準測量」の下に来ないように：独立レビュー v4.7）
      tl.fromTo("#ml-band", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, c.icons);
      tl.fromTo("#ml-fit", { y: 0 }, { y: 100, duration: 0.5, ease: "power3.out" }, c.icons);
      JOBS.forEach((_, i) => {
        tl.fromTo("#ml-item-" + i, { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, c.icons + 0.1 + i * 0.06);
      });
      // links：基準点測量から地形測量・路線測量へ線がのび、先のアイコンが灯る（効果音③クリック小さめ）
      tl.fromTo("#ml-arc-src", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, c.links - 0.1);
      USERS.forEach((u, k) => {
        tl.fromTo("#ml-arc-" + k, { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, c.links + k * 0.12);
        tl.fromTo("#ml-icon-" + u, { color: NAVY }, { color: ORANGE, duration: 0.2, ease: "power2.out" }, c.links + 0.35 + k * 0.12);
        tl.to("#ml-item-" + u + " .ml-label", { color: tok("--ink", "#14202E"), duration: 0.2, ease: "power2.out" }, c.links + 0.35 + k * 0.12);
      });
      // 引き終わった後も地図がごくゆっくり引き続ける（毎秒0.5%。言葉を待つ間に止まって見えないように）
      const p1 = c.points + 1.3;
      tl.fromTo("#ml-push", { scale: 1, transformOrigin: "50% 60%" }, { scale: 1 - 0.005 * (dur - p1), transformOrigin: "50% 60%", duration: dur - p1, ease: "none" }, p1);
      tl.set({}, {}, dur);
      window.__timelines["map_link"] = tl;
    })();
  </script>
</template>
