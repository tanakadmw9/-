<html data-composition-variables='[{"id":"cues","type":"string","label":"cues","default":"{\"in\":0.0,\"hop1\":1.15,\"hop2\":1.7,\"hop3\":2.25,\"road\":2.9,\"drop\":3.4,\"drop_end\":4.55,\"out\":4.95}"},{"id":"dur","type":"number","label":"dur","default":5.0566}]'>
<body>
<template>
  <style>
    /* B7 d3_relay（紙・全幅）：道の縦の断面。左の水準点 10.00 m から、レベルと 2 本の標尺の小さな組が右へ 3 回「尺取り」
       （レベルが前へ → うしろの標尺が追い越して前の標尺になる、の順に 1 つずつ）。ホップごとにオレンジの点線が灯り、
       新しい地面の点の下に高さ（9.40 → 9.75 → 9.20 → 9.60）。→ 断面が太って道路の線（紺）になり、いちばん低い 9.20 に排水の口。
       → 紺の水のしずくが高い所から低い所へ転がって、排水の口に吸い込まれる（声なしの答え：N2「雨の水が道のはしへ流れるのは…」）。
       高さは見やすいよう縦を強調（1 m＝220px）。組は標尺 340px・望遠鏡の高さ 200px。【要監修：尺取りの手順の簡略化】 */
    #root { position: absolute; inset: 0; overflow: hidden; }
    #dr-bg { position: absolute; inset: 0; background: var(--paper); }
    #dr-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    .dr-txt { position: absolute; font-family: var(--font-ja); line-height: 1.2; font-feature-settings: "palt"; white-space: nowrap;
      padding: 4px 12px 6px; border-radius: 8px; background: color-mix(in srgb, var(--paper) 94%, transparent); opacity: 0; }
    .dr-num { font-family: var(--font-num); font-weight: 700; font-size: 64px; color: var(--orange-dark); letter-spacing: -0.02em; text-align: center; }
    #dr-bm { text-align: center; }
    #dr-bm-a { font-weight: 700; font-size: 48px; color: var(--navy); }
    #dr-bm-n { font-family: var(--font-num); font-weight: 700; font-size: 64px; color: var(--navy); letter-spacing: -0.02em; }
    #dr-note { right: 96px; bottom: 58px; font-weight: 400; font-size: 34px; color: color-mix(in srgb, var(--ink) 80%, var(--paper)); }
  </style>
  <div id="root" data-composition-id="d3_relay" data-width="1920" data-height="1080">
    <div id="dr-bg"></div>
    <svg id="dr-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dr-gridpat" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
          <path d="M80 0 H0 V80" fill="none" stroke="var(--grid)" stroke-width="1.5"/>
        </pattern>
        <pattern id="dr-hatchpat" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
          <path d="M0 18 H36" stroke="var(--grid)" stroke-width="4"/>
        </pattern>
        <clipPath id="dr-gclip"><rect id="dr-gclip-r" x="0" y="0" width="0" height="1080"/></clipPath>
      </defs>
      <rect id="dr-grid" x="0" y="0" width="1920" height="1080" fill="url(#dr-gridpat)" opacity="0"/>
      <g clip-path="url(#dr-gclip)">
        <path id="dr-earth" style="fill: color-mix(in srgb, var(--grid) 38%, var(--paper))"/>
        <path id="dr-earth-h" fill="url(#dr-hatchpat)" opacity="0.8"/>
      </g>
      <path id="dr-ground" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
            pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="100"/>
      <!-- 道路の面（road）：紺の太い線 -->
      <path id="dr-road" fill="none" stroke="var(--navy)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"
            pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="100"/>
      <!-- 排水の口（いちばん低い点）：道路の下のます＋格子 -->
      <g id="dr-drain" opacity="0" stroke="var(--navy)" stroke-linecap="round" stroke-linejoin="round">
        <path id="dr-drain-box" d="" stroke-width="5" style="fill: var(--paper)"/>
        <path id="dr-drain-bars" d="" stroke-width="4" fill="none"/>
      </g>
      <!-- 水準点の標石 -->
      <g id="dr-stone" opacity="0">
        <rect id="dr-stone-r" width="72" height="104" rx="3" stroke="var(--navy)" stroke-width="5" style="fill: var(--paper)"/>
        <path id="dr-stone-cap" stroke="var(--navy)" stroke-width="3" style="fill: var(--navy)"/>
      </g>
      <g id="dr-marks"></g>
      <g id="dr-lines"></g>
      <!-- 尺取りの組：標尺 2 本とレベル（原点＝地面の点） -->
      <g id="dr-set">
        <g id="dr-staff-a"></g>
        <g id="dr-staff-b"></g>
        <g id="dr-level" stroke="var(--navy)" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-16 -164 L-60 0 M16 -164 L60 0" stroke-width="7" fill="none"/>
          <rect x="-38" y="-178" width="76" height="14" rx="3" stroke-width="5" style="fill: var(--paper)"/>
          <rect x="-60" y="-220" width="120" height="40" rx="10" stroke-width="5" style="fill: var(--paper)"/>
        </g>
      </g>
      <!-- 水のしずく（紺の塗り） -->
      <g id="dr-drop" opacity="0">
        <g id="dr-drop-in"><path transform="scale(1.9)" d="M0 -46 C10 -30 22 -18 22 -2 A22 22 0 0 1 -22 -2 C-22 -18 -10 -30 0 -46 Z" style="fill: var(--navy)"/></g>
      </g>
      <circle id="dr-ripple" r="20" fill="none" stroke="var(--navy)" stroke-width="4" opacity="0"/>
    </svg>
    <div id="dr-bm" class="dr-txt"><div id="dr-bm-a">水準点</div><div id="dr-bm-n">10.00 m</div></div>
    <div id="dr-n1" class="dr-txt dr-num">9.40 m</div>
    <div id="dr-n2" class="dr-txt dr-num">9.75 m</div>
    <div id="dr-n3" class="dr-txt dr-num">9.20 m</div>
    <div id="dr-n4" class="dr-txt dr-num">9.60 m</div>
    <div id="dr-note" class="dr-txt">数字は例です</div>
  </div>
  <script>
    (function () {
      const v = window.__hyperframes.getVariables();
      const c = JSON.parse(v.cues);
      const dur = Number(v.dur) || 5.06;
      const q = (s) => document.querySelector(s);

      // ── 道の縦の断面：5 つの点（x, 高さ m）。y = 780 − (h − 9.20) × 300 ──
      const H = [10.00, 9.40, 9.75, 9.20, 9.60];
      const X = [220, 590, 960, 1330, 1680];
      const yOfH = (h) => 720 - (h - 9.2) * 220;
      const Y = H.map(yOfH);
      // 点のあいだはなめらかな曲線（点の上で水平＝山と谷がその点）。両端はゆるく平らに画面の外まで
      function gy(x) {
        if (x <= X[0]) return Y[0];
        if (x >= X[4]) return Y[4];
        let i = 0; while (x > X[i + 1]) i++;
        const t = (x - X[i]) / (X[i + 1] - X[i]);
        return Y[i] + (Y[i + 1] - Y[i]) * (1 - Math.cos(Math.PI * t)) / 2;
      }
      let d = "";
      for (let x = 0; x <= 1920; x += 6) d += (x ? "L" : "M") + x + " " + gy(x).toFixed(1);
      q("#dr-ground").setAttribute("d", d);
      q("#dr-road").setAttribute("d", d);
      q("#dr-earth").setAttribute("d", d + " V1080 H0 Z");
      q("#dr-earth-h").setAttribute("d", d + " V1080 H0 Z");

      // 標石（P0）
      q("#dr-stone-r").setAttribute("x", X[0] - 36); q("#dr-stone-r").setAttribute("y", Y[0] - 10);
      q("#dr-stone-cap").setAttribute("d", `M${X[0] - 15} ${Y[0] - 10} A15 9 0 0 1 ${X[0] + 15} ${Y[0] - 10} Z`);
      // 排水の口（P3）
      const DX = X[3], DY = Y[3];
      q("#dr-drain-box").setAttribute("d", `M${DX - 46} ${DY + 8} V${DY + 76} H${DX + 46} V${DY + 8}`);
      q("#dr-drain-bars").setAttribute("d", `M${DX - 27} ${DY + 2} V${DY + 18} M${DX - 9} ${DY + 2} V${DY + 18} M${DX + 9} ${DY + 2} V${DY + 18} M${DX + 27} ${DY + 2} V${DY + 18}`);

      // 文字の位置：点の真下（地面の下）
      const bm = q("#dr-bm"); bm.style.left = (X[0] - 120) + "px"; bm.style.top = (Y[0] + 110) + "px"; bm.style.width = "240px";
      for (let i = 1; i <= 4; i++) {
        const el = q("#dr-n" + i); el.style.left = (X[i] - 115) + "px"; el.style.width = "230px";
        el.style.top = (Y[i] + (i === 3 ? 100 : 40)) + "px";
      }
      // 地面の点（オレンジ）と、ホップごとの目線の点線
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, at, parent) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); q(parent).appendChild(e); return e; };
      for (let i = 1; i <= 4; i++) mk("circle", { id: "dr-pt" + i, cx: X[i], cy: Y[i], r: 11, stroke: "var(--paper)", "stroke-width": 4, opacity: 0, style: "fill: var(--orange)" }, "#dr-marks");
      const TH = 200;   // レベルの望遠鏡の高さ（px）
      const mid = (i) => (X[i] + X[i + 1]) / 2;
      const lineY = (i) => gy(mid(i)) - TH;
      for (let i = 0; i < 4; i++) mk("line", { id: "dr-sl" + i, x1: X[i], y1: lineY(i), x2: X[i + 1], y2: lineY(i), stroke: "var(--orange)", "stroke-width": 8,
        "stroke-linecap": "round", "stroke-dasharray": "0 18", opacity: 0 }, "#dr-lines");

      // 標尺（高さ 260、幅 18、10 cm ごとの目盛り）
      const staff = (sel) => {
        let s = `<rect x="-14" y="-340" width="28" height="340" rx="3" style="fill: var(--white)" stroke="var(--navy)" stroke-width="5"/>`;
        for (let k = 1; k < 17; k++) s += `<rect x="-11" y="${-k * 20}" width="${k % 5 === 0 ? 22 : 12}" height="10" style="fill: var(--navy)"/>`;
        q(sel).innerHTML = s;
      };
      staff("#dr-staff-a"); staff("#dr-staff-b");

      // 物を地面に沿って動かす（x を決めると y は断面から。lift は持ち上げる高さ）
      const place = (sel, x, lift) => gsap.set(sel, { x: x, y: gy(x) - (lift || 0) });
      const tl = gsap.timeline({ paused: true });
      const IN = { duration: 0.45, ease: "power3.out" };
      const along = (sel, x0, x1, at, du, arc) => {
        const p = { t: 0 };
        tl.fromTo(p, { t: 0 }, { t: 1, duration: du, ease: "power2.inOut",
          onUpdate: () => { const x = x0 + (x1 - x0) * p.t; place(sel, x, (arc || 0) * Math.sin(Math.PI * p.t)); } }, at);
      };
      // 初めの位置
      tl.set("#dr-staff-a", { x: X[0], y: Y[0] - 10 }, 0);
      tl.set("#dr-staff-b", { x: X[1], y: Y[1] }, 0);
      tl.set("#dr-level", { x: mid(0), y: gy(mid(0)) }, 0);

      // in：方眼 → 断面が左から右へ → 標石と「水準点 10.00 m」→ 1 組目（標石の上の標尺・レベル・前の標尺）→ 点線が灯り 9.40
      const i0 = c.in;
      tl.fromTo("#dr-grid", { opacity: 0 }, { opacity: 0.7, duration: 0.3, ease: "power1.out" }, i0);
      tl.fromTo("#dr-ground", { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.55, ease: "power2.inOut" }, i0);
      tl.fromTo("#dr-gclip-r", { attr: { width: 0 } }, { attr: { width: 1920 }, duration: 0.55, ease: "power2.inOut" }, i0);
      tl.fromTo("#dr-stone", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, i0 + 0.2);
      tl.fromTo("#dr-bm", { opacity: 0, y: 14 }, { opacity: 1, y: 0, ...IN }, i0 + 0.3);
      tl.fromTo("#dr-set", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, i0 + 0.45);
      const flash = (i, at) => {
        tl.fromTo("#dr-sl" + i, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, at);
        tl.fromTo("#dr-sl" + i, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, at + 0.3);
      };
      const newPoint = (i, at) => {
        tl.fromTo("#dr-pt" + i, { opacity: 0, scale: 0.4, svgOrigin: X[i] + " " + Y[i] }, { opacity: 1, scale: 1, svgOrigin: X[i] + " " + Y[i], duration: 0.25, ease: "power3.out" }, at);
        tl.fromTo("#dr-n" + i, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at + 0.05);
      };
      flash(0, i0 + 0.75);
      newPoint(1, i0 + 0.85);

      // hop1〜3：レベルが前へ（0.22 秒）→ うしろの標尺が追い越して前の標尺へ（0.26 秒、少し持ち上げて）→ 点線 → 新しい高さ
      const hops = [[c.hop1, "#dr-staff-a", 0, 2], [c.hop2, "#dr-staff-b", 1, 3], [c.hop3, "#dr-staff-a", 2, 4]];
      hops.forEach(([t, st, from, to], k) => {
        along("#dr-level", mid(k), mid(k + 1), t, 0.22, 0);
        along(st, X[from], X[to], t + 0.12, 0.28, 60);
        flash(k + 1, t + 0.36);
        newPoint(to, t + 0.42);
      });

      // road：組が消え、断面が太って紺の道路の線になる。いちばん低い所に排水の口
      const r0 = c.road;
      tl.fromTo("#dr-set", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, r0);
      tl.fromTo("#dr-road", { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.inOut" }, r0 + 0.15);
      tl.fromTo("#dr-drain", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, r0 + 0.55);

      // drop：高い所（9.75 の点）に紺のしずく → 道路に沿って低い 9.20 の排水の口へ転がる（だんだん速く）
      const p0x = X[2];
      tl.fromTo("#dr-drop", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, c.drop);
      tl.fromTo("#dr-drop-in", { scale: 0.3, transformOrigin: "50% 100%" }, { scale: 1, transformOrigin: "50% 100%", duration: 0.3, ease: "power3.out" }, c.drop);
      const rp = { t: 0 };
      tl.set("#dr-drop", { x: p0x, y: gy(p0x) - 46 }, 0);
      const rollD = Math.max(0.6, c.drop_end - c.drop - 0.3);
      tl.fromTo(rp, { t: 0 }, { t: 1, duration: rollD, ease: "power2.in",
        onUpdate: () => { const x = p0x + (DX - p0x) * rp.t; gsap.set("#dr-drop", { x: x, y: gy(x) - 46 }); } }, c.drop + 0.3);
      // drop_end：排水の口に吸い込まれる（縮んで消え、紺の輪が一度だけ広がる）
      tl.fromTo("#dr-drop-in", { scale: 1, transformOrigin: "50% 100%" }, { scale: 0.2, transformOrigin: "50% 100%", duration: 0.3, ease: "power2.in", immediateRender: false }, c.drop_end);
      tl.fromTo("#dr-drop", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, c.drop_end);
      tl.fromTo("#dr-ripple", { opacity: 0.9, attr: { cx: DX, cy: DY, r: 12 } }, { opacity: 0, attr: { cx: DX, cy: DY, r: 70 }, duration: 0.6, ease: "power2.out", immediateRender: false }, c.drop_end + 0.15);

      tl.fromTo("#dr-note", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, c.in + 0.9);
      // out：次は締めの実写。最後の状態のまま
      tl.set({}, {}, dur);
      window.__timelines["d3_relay"] = tl;
    })();
  </script>
</template>
</body>
</html>
