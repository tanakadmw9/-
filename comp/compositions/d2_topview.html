<html data-composition-variables='[{"id":"cues","type":"string","label":"cues","default":"{\"setup\":0.0,\"known\":1.2,\"angle\":2.82,\"distance\":4.24,\"new_point\":5.15,\"fix\":6.76}"},{"id":"dur","type":"number","label":"dur","default":9.009}]'>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; }
    #d2-bg { position: absolute; inset: 0; background: var(--paper); }
    #d2-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    .d2-lbl { position: absolute; font-family: var(--font-ja); line-height: 1.35; font-feature-settings: "palt"; white-space: nowrap; }
    .d2-navy { color: var(--navy); }
    .d2-od { color: var(--orange-dark); }
    .d2-b { font-weight: 700; }
    #d2-lbl-b { left: 104px; top: 211px; width: 320px; text-align: right; font-size: 36px; font-weight: 400; }
    #d2-lbl-a { left: 112px; top: 727px; width: 360px; text-align: right; font-size: 48px; }
    #d2-lbl-angle { left: 580px; top: 560px; width: 160px; text-align: center; font-size: 52px; }
    #d2-lbl-dist { left: 870px; top: 534px; width: 160px; text-align: center; font-size: 52px; }
    #d2-lbl-new { left: 1200px; top: 376px; width: 360px; text-align: center; font-size: 48px; }
  </style>
  <div id="root" data-composition-id="d2_topview" data-width="1920" data-height="1080">
    <div id="d2-bg"></div>
    <div id="d2-push" style="position: absolute; inset: 0;">
    <svg id="d2-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 方眼：80px 間隔。A(560,760) が交点に乗るよう y を 40 ずらす -->
        <pattern id="d2-gridpat" x="0" y="40" width="80" height="80" patternUnits="userSpaceOnUse">
          <path d="M80 0 H0 V80" fill="none" stroke="var(--grid)" stroke-width="1.5"/>
        </pattern>
      </defs>
      <rect id="d2-grid" x="0" y="0" width="1920" height="1080" fill="url(#d2-gridpat)" opacity="0"/>

      <!-- A→B 紺の点線（基準の向き） -->
      <line id="d2-ab" x1="560" y1="760" x2="560" y2="760" stroke="var(--navy)" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 15" opacity="0"/>
      <!-- 角度：回る線とオレンジの弧 -->
      <line id="d2-ray" x1="560" y1="760" x2="790" y2="760" stroke="var(--orange)" stroke-width="5" stroke-linecap="round" opacity="0"/>
      <path id="d2-arc" d="M540.5 651.7 A110 110 0 0 1 665.6 729.1" fill="none" stroke="var(--orange)" stroke-width="5" stroke-linecap="round"
            pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="100" opacity="0"/>
      <!-- 距離：A→P の光の線 -->
      <line id="d2-ap-glow" x1="560" y1="760" x2="1380" y2="520" stroke="var(--orange)" stroke-width="16" stroke-linecap="round" opacity="0.18"/>
      <line id="d2-ap" x1="560" y1="760" x2="1380" y2="520" stroke="var(--orange)" stroke-width="5" stroke-linecap="round"/>
      <!-- 距離：光の粒が A→P→A（d1 の測距と同じ言葉） -->
      <g id="d2-photon" opacity="0">
        <circle r="20" fill="var(--orange)" opacity="0.28"/>
        <circle r="9" fill="var(--orange)"/>
      </g>
      <circle id="d2-bounce" cx="1380" cy="520" r="28" fill="none" stroke="var(--orange)" stroke-width="4" opacity="0"/>

      <!-- B：もう一つの既知点 -->
      <g id="d2-B" transform="translate(470 260)">
        <g id="d2-B-in" opacity="0">
          <path d="M0 -38 L32.9 19 L-32.9 19 Z" fill="var(--paper)" stroke="var(--navy)" stroke-width="5" stroke-linejoin="round"/>
          <circle r="6" fill="var(--navy)"/>
        </g>
      </g>
      <!-- P：新しい点 -->
      <g id="d2-P" transform="translate(1380 520)">
        <g id="d2-P-in">
          <circle r="28" fill="var(--paper)" stroke="var(--orange)" stroke-width="5"/>
          <circle r="12" fill="none" stroke="var(--orange)" stroke-width="5"/>
          <circle id="d2-P-dot" r="11" fill="var(--orange)" opacity="0"/>
        </g>
        <circle id="d2-P-pulse" r="28" fill="none" stroke="var(--orange)" stroke-width="4" opacity="0"/>
      </g>
      <!-- 照準：「決まります」で P に合う（章扉・タイトル・締めと同じ記号。デザイン G5） -->
      <g id="d2-ret" transform="translate(1380 520)">
        <g id="d2-ret-in" opacity="0" fill="none" stroke="var(--orange)" stroke-linecap="round">
          <circle r="47" stroke-width="5"/>
          <path d="M0 -67V-33M0 33V67M-67 0H-33M33 0H67" stroke-width="5"/>
        </g>
      </g>
      <!-- A：わかっている点（d1 の TS 位置から移ってくる）＋真上から見た TS -->
      <g id="d2-A" transform="translate(560 760)">
        <g id="d2-ts" opacity="0">
          <circle id="d2-ts-ring" r="50" fill="none" stroke="var(--navy)" stroke-width="3" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="100" transform="rotate(-90)"/>
          <path id="d2-ts-ticks" d="M0 -50 V-66 M50 0 H66 M0 50 V66 M-50 0 H-66" stroke="var(--navy)" stroke-width="3" stroke-linecap="round" opacity="0"/>
        </g>
        <g id="d2-A-in">
          <path d="M0 -38 L32.9 19 L-32.9 19 Z" fill="var(--paper)" stroke="var(--navy)" stroke-width="5" stroke-linejoin="round"/>
          <circle r="6" fill="var(--navy)"/>
        </g>
      </g>
    </svg>

    <div id="d2-lbl-b" class="d2-lbl d2-navy">もう一つの<br>わかっている点</div>
    <div id="d2-lbl-a" class="d2-lbl d2-navy d2-b">わかっている点</div>
    <div id="d2-lbl-angle" class="d2-lbl d2-od d2-b">角度</div>
    <div id="d2-lbl-dist" class="d2-lbl d2-od d2-b">距離</div>
    <div id="d2-lbl-new" class="d2-lbl d2-od d2-b">新しい点</div>
    </div>
  </div>
  <script>
    (function () {
      const v = window.__hyperframes.getVariables();
      const c = JSON.parse(v.cues);
      const dur = Number(v.dur) || 9;

      // 配置（docs/08 §4）。d3 の冒頭もこの座標で描く
      const A = [560, 760], B = [470, 260], P = [1380, 520];
      const deg = (p) => Math.atan2(p[1] - A[1], p[0] - A[0]) * 180 / Math.PI;
      const angAB = deg(B), angAP = deg(P);
      const R = 110;
      const pt = (a, r) => [A[0] + r * Math.cos(a * Math.PI / 180), A[1] + r * Math.sin(a * Math.PI / 180)];
      const s0 = pt(angAB, R), s1 = pt(angAP, R);
      document.querySelector("#d2-arc").setAttribute("d",
        "M" + s0[0].toFixed(1) + " " + s0[1].toFixed(1) + " A" + R + " " + R + " 0 0 1 " + s1[0].toFixed(1) + " " + s1[1].toFixed(1));


      const tl = gsap.timeline({ paused: true });
      const IN = { duration: 0.5, ease: "power3.out" };
      const rise = (s, at) => tl.fromTo(s, { opacity: 0, y: 20 }, { opacity: 1, y: 0, ...IN }, at);
      const show = (s, at, op) => tl.fromTo(s, { opacity: 0 }, { opacity: op || 1, duration: 0.01, ease: "none" }, at);
      const draw = (s, at, d, ease, op) => { show(s, at, op); tl.fromTo(s, { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: d, ease: ease || "power2.inOut" }, at); };
      const pop = (s, at, d) => tl.fromTo(s, { opacity: 0, scale: 0.6, svgOrigin: "0 0" }, { opacity: 1, scale: 1, svgOrigin: "0 0", duration: d || 0.45, ease: "power3.out" }, at);

      // ---- setup：d1 の終わり（A に △、P に ◎、A→P の光の線）から。方眼、B、A→B の点線を足す
      const s = c.setup;
      // D1 から持ち込んだ線と P は、いったん薄い影にする（答えを先に見せず、角度→距離→新しい点の順で現す）
      tl.fromTo("#d2-ap", { opacity: 1 }, { opacity: 0.15, duration: 0.4, ease: "power2.inOut" }, s + 0.1);
      tl.fromTo("#d2-ap-glow", { opacity: 0.18 }, { opacity: 0.03, duration: 0.4, ease: "power2.inOut" }, s + 0.1);
      tl.fromTo("#d2-P-in", { opacity: 1 }, { opacity: 0.15, duration: 0.4, ease: "power2.inOut" }, s + 0.1);
      tl.fromTo("#d2-grid", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.inOut" }, s + 0.05);
      pop("#d2-B-in", s + 0.4, 0.4);
      show("#d2-ab", s + 0.52);
      tl.fromTo("#d2-ab", { attr: { x2: A[0], y2: A[1] } }, { attr: { x2: B[0], y2: B[1] }, duration: 0.45, ease: "power2.inOut" }, s + 0.52);
      rise("#d2-lbl-b", s + 0.75);

      // ---- known：「わかっている点」。A を1回だけ強調、真上から見た TS
      const k = c.known;
      rise("#d2-lbl-a", k);
      tl.fromTo("#d2-A-in", { scale: 1, svgOrigin: "0 0" }, { scale: 1.15, svgOrigin: "0 0", duration: 0.25, ease: "power2.out" }, k + 0.15);
      tl.fromTo("#d2-A-in", { scale: 1.15, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: 0.55, ease: "power2.inOut", immediateRender: false }, k + 0.4);
      show("#d2-ts", k + 0.75);
      tl.fromTo("#d2-ts-ring", { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, k + 0.75);
      tl.fromTo("#d2-ts-ticks", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, k + 1.0);

      // ---- angle：AB の向きから AP の向きへ線が回り、オレンジの弧がのびる（0.8秒）
      const a = c.angle;
      tl.fromTo("#d2-ray", { opacity: 0, rotation: angAB, svgOrigin: "560 760" }, { opacity: 1, duration: 0.12, ease: "none" }, a);
      tl.fromTo("#d2-ray", { rotation: angAB, svgOrigin: "560 760" }, { rotation: angAP, svgOrigin: "560 760", duration: 0.8, ease: "power2.inOut", immediateRender: false }, a + 0.08);
      draw("#d2-arc", a + 0.08, 0.8, "power2.inOut");
      rise("#d2-lbl-angle", a + 0.6);

      // ---- distance：線が影から実線に戻る
      tl.fromTo("#d2-ap", { opacity: 0.15 }, { opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, c.distance);
      tl.fromTo("#d2-ap-glow", { opacity: 0.03 }, { opacity: 0.18, duration: 0.4, ease: "power2.out", immediateRender: false }, c.distance);
      // ---- distance：A→P の線の上を光の粒が往復（0.4秒ずつ＝0.8秒）
      const d = c.distance;
      tl.fromTo("#d2-photon", { opacity: 0, x: A[0], y: A[1] }, { opacity: 1, duration: 0.06, ease: "none" }, d);
      tl.fromTo("#d2-photon", { x: A[0], y: A[1] }, { x: P[0], y: P[1], duration: 0.4, ease: "power1.inOut", immediateRender: false }, d);
      tl.fromTo("#d2-bounce", { opacity: 0.9, attr: { r: 28 } }, { opacity: 0, attr: { r: 56 }, duration: 0.4, ease: "power2.out" }, d + 0.4);
      tl.fromTo("#d2-photon", { x: P[0], y: P[1] }, { x: A[0], y: A[1], duration: 0.4, ease: "power1.inOut", immediateRender: false }, d + 0.4);
      tl.fromTo("#d2-photon", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, d + 0.8);
      rise("#d2-lbl-dist", d + 0.45);

      // ---- new_point：線の先の◎を1回だけ強調。「新しい点」
      const n = c.new_point;
      tl.fromTo("#d2-P-in", { opacity: 0.15 }, { opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, n);
      tl.fromTo("#d2-P-in", { scale: 1, svgOrigin: "0 0" }, { scale: 1.2, svgOrigin: "0 0", duration: 0.25, ease: "power2.out" }, n);
      tl.fromTo("#d2-P-in", { scale: 1.2, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: 0.5, ease: "power2.inOut", immediateRender: false }, n + 0.25);
      rise("#d2-lbl-new", n + 0.15);

      // ---- fix：「決まります」。P の中心が塗られて位置が確定する（効果音③クリック）。座標の数字は出さない（内容プラン）
      const f = c.fix;
      tl.fromTo("#d2-P-dot", { opacity: 0, attr: { r: 4 } }, { opacity: 1, attr: { r: 11 }, duration: 0.18, ease: "power3.out" }, f);
      tl.fromTo("#d2-P-pulse", { opacity: 0.9, attr: { r: 28 } }, { opacity: 0, attr: { r: 70 }, duration: 0.55, ease: "power2.out" }, f);

      // 照準が P に合う（1.6→1倍、0.45秒）→ 0.6秒とどまって消える。合わせて角度・距離の補助を半分に下げ、P を主役にする
      tl.fromTo("#d2-ret-in", { opacity: 0, scale: 1.6, svgOrigin: "0 0" }, { opacity: 1, scale: 1, svgOrigin: "0 0", duration: 0.45, ease: "power3.out" }, f - 0.3);
      tl.to("#d2-ret-in", { opacity: 0, duration: 0.3, ease: "power2.in" }, f + 0.75);
      tl.to(["#d2-arc", "#d2-ray", "#d2-lbl-angle", "#d2-lbl-dist"], { opacity: 0.5, duration: 0.4, ease: "power2.inOut" }, f);
      // 札は「新しい点」のまま終える。「新しい基準点」と呼ぶのは、ほかの点とつないで確かめた後（点つなぎの△）だけ（独立レビュー v4.7）

      // 場面全体：A と P の間へごくゆっくり寄り（毎秒0.4%）、決まった後はゆっくり引いて次の「点つなぎ」へ
      const pk = Math.min(dur, f + 0.9);
      tl.fromTo("#d2-push", { scale: 1, transformOrigin: "50% 59%" }, { scale: 1 + 0.004 * pk, transformOrigin: "50% 59%", duration: pk, ease: "none" }, 0);
      if (dur - pk > 0.3) tl.to("#d2-push", { scale: 0.95, duration: dur - pk, ease: "power1.inOut" }, pk);
      tl.set({}, {}, dur);
      window.__timelines["d2_topview"] = tl;
    })();
  </script>
</template>
</body>
</html>
